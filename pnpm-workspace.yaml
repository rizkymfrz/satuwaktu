packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  "@prisma/engines": true
  esbuild: true
  prisma: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - "@expo/cli@57.0.28 || 57.0.29 || 58.1.16"
  - "@expo/config-plugins@57.0.10"
  - "@expo/config@57.0.10"
  - "@expo/image-utils@0.11.6"
  - "@expo/metro-config@57.0.13 || 58.0.18"
  - "@expo/metro-file-map@57.0.4"
  - "@expo/prebuild-config@57.0.17 || 57.0.18"
  - "@expo/require-utils@57.0.6"
  - "@expo/router-server@57.0.12 || 58.0.18"
  - babel-preset-expo@57.0.14 || 57.0.15 || 58.0.21
  - expo-asset@57.0.19
  - expo-constants@57.0.21
  - expo-modules-autolinking@57.0.14 || 57.0.15
  - expo-modules-core@57.0.21 || 57.0.22 || 58.0.27
  - expo@57.0.27 || 57.0.28 || 58.0.20
  - "@expo/ui@57.0.22 || 57.0.23"
  - expo-linking@57.0.12
  - expo-router@57.0.25 || 57.0.26 || 58.0.27
  - "@expo/fingerprint@0.20.14 || 0.21.7"
  - "@expo/inline-modules@0.1.8"
  - "@expo/local-build-cache-provider@57.0.9"
  - expo-modules-jsi@57.1.2 || 58.0.20
  - expo-location@57.0.21
  - expo-splash-screen@57.0.10
  - expo-file-system@58.0.12
  - expo-modules-cli@0.3.3
supportedArchitectures:
  os:
    - current
    - win32
  cpu:
    - current
    - x64
    - arm64
